[project]
name = "down-dog"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
# Добавляет backend/ в sys.path: тесты импортируют модули так же, как main.py
# в контейнере ("from generator import ..."), иначе mypy видит один файл
# под двумя именами модуля
pythonpath = ["backend"]

[tool.mypy]
python_version = "3.14"
# Код бэкенда импортирует соседние модули напрямую ("from database import ..."),
# как и при запуске в контейнере из backend/
mypy_path = "backend"
# Все функции должны быть с аннотациями типов, иначе mypy их не проверяет
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[tool.ruff]
# Python-версия, под которую пишем код
target-version = "py314"
# Максимальная длина строки
line-length = 88

[tool.ruff.lint]
# Описание каждого правила: https://docs.astral.sh/ruff/rules/
select = [
  "E", "W",  # pycodestyle: стиль
  "F",       # pyflakes: неиспользуемые импорты/переменные, опечатки в именах
  "I",       # isort: порядок импортов
  "B",       # bugbear: частые баги (мутабельные дефолты и т.п.)
  "UP",      # pyupgrade: современный синтаксис (list[str], X | None)
  "SIM",     # упрощение кода
  "C4",      # comprehensions
  "C90",     # цикломатическая сложность функций
  "N",       # pep8-naming
  "S",       # bandit: безопасность (SQL-инъекции, хардкод секретов, eval)
  "T20",     # print() вместо logging
  "RUF",     # правила самого ruff
  "FAST",    # FastAPI
]
ignore = [
  # Ругаются на кириллицу, похожую на латиницу — в русскоязычном проекте бесполезны
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# assert в тестах — норма
"**/*_test.py" = ["S101"]
"**/test_*.py" = ["S101"]
# CLI-скрипты пишут в консоль
"s3/**" = ["T201"]
"scripts/**" = ["T201"]
