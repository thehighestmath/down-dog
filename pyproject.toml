[project]
name = "down-dog"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
# Добавляет корень проекта в sys.path, чтобы импорт "backend" работал
# и при запуске консольной командой "pytest" (не только "python -m pytest")
pythonpath = ["."]

[tool.ruff]
# Python-версия, под которую пишем код
target-version = "py314"
# Максимальная длина строки
line-length = 88

[tool.ruff.lint]
# Правила: E/Pyflakes-ошибки, F/имя-не-используется и пр., W/предупреждения,
# I/порядок импортов, B/часто встречающиеся баги (bugbear)
select = ["E", "F", "W", "I", "B"]
