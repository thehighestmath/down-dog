x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: '5432'
  POSTGRES_DB: app_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

services:
  backend:
    build: ./backend
    container_name: app-backend
    ports:
      - '8000:8000'
    environment:
      <<: *db-env
      PYTHONUNBUFFERED: '1'
      MINIO_ENDPOINT: http://minio:9000
      ACCESS_KEY: minioadmin
      SECRET_KEY: minioadmin
      BUCKET_NAME: down-dog
    depends_on:
      minio:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ['python', 'migrate.py']
    environment:
      <<: *db-env
      PYTHONUNBUFFERED: '1'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: 'no'

  frontend:
    build: ./frontend
    container_name: app-frontend
    ports:
      - '3000:8080'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_db']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  adminer:
    image: adminer:6.1.1
    container_name: app-adminer
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - db
    networks:
      - app-network

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: down-dog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  s3:
    build:
      context: .
      dockerfile: s3/Dockerfile
    container_name: down-dog-s3
    environment:
      MINIO_ENDPOINT: http://minio:9000
      ACCESS_KEY: minioadmin
      SECRET_KEY: minioadmin
      BUCKET_NAME: down-dog
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network
    restart: 'no'

volumes:
  minio_data:
  postgres_data:

networks:
  app-network:
    driver: bridge
