services:
  backend:
    build: ./backend
    container_name: app-backend
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
      - MINIO_ENDPOINT=http://minio:9000
      - ACCESS_KEY=minioadmin
      - SECRET_KEY=minioadmin
      - BUCKET_NAME=down-dog

      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=app_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app_db
    depends_on:
      minio:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: app-frontend
    ports:
      - '3000:8080'
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app_db']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  adminer:
    image: adminer:6.1.1
    container_name: app-adminer
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - db
    networks:
      - app-network

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: down-dog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  s3:
    build:
      context: .
      dockerfile: s3/Dockerfile
    container_name: down-dog-s3
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - ACCESS_KEY=minioadmin
      - SECRET_KEY=minioadmin
      - BUCKET_NAME=down-dog
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network
    restart: 'no'

volumes:
  minio_data:
  postgres_data:

networks:
  app-network:
    driver: bridge
