# Разделы автоматических release notes (workflow release.yml): список влитых
# ПР, разложенный по меткам. ПР попадает в первый подходящий раздел.
# Метки области ставит pr-labels.yml по изменённым файлам.
# Формат: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Зависимости
      labels: [dependencies]
    - title: Android
      labels: [android]
    - title: Фронтенд
      labels: [frontend]
    - title: Бэкенд и база данных
      labels: [backend, database, api, tts]
    - title: Инфраструктура и CI
      labels: [infrastructure, docker]
    - title: Тесты
      labels: [testing]
    - title: Документация
      labels: [documentation]
    - title: Прочее
      labels: ['*']
