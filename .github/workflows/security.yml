name: Security

on:
  push:
    branches:
      - master
  pull_request:
  # Раз в неделю: новая уязвимость в старой зависимости появляется без всякого ПР
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets in git history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, not just the last commit:
          # a secret that was committed and then deleted is still leaked
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        run: |
          echo "ЧТО: gitleaks - пароли, токены и ключи во всей истории git."
          echo "ЗАЧЕМ: секрет, попавший в git, остаётся в истории даже после удаления файла,"
          echo "       и его может достать любой, у кого есть доступ к репозиторию."
          if ! docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --verbose /repo; then
            echo "::error title=gitleaks::Найден секрет в истории git, подробности в логе шага"
            echo "КАК ИСПРАВИТЬ: 1) сразу смени (отзови) этот пароль/токен - он уже утёк;"
            echo "  2) убери его из кода, читай из переменной окружения или .env (он в .gitignore);"
            echo "  3) если это ложное срабатывание - добавь Fingerprint из лога в .gitleaksignore"
            echo "     и согласуй с ментором."
            exit 1
          fi

  trivy-config:
    name: Dockerfile misconfigurations (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker image instead of aquasecurity/trivy-action: the action's tags
      # were hijacked in a supply chain attack, a pinned image is safer.
      - name: Scan
        run: |
          echo "ЧТО: trivy config - опасные настройки в Dockerfile (HIGH и CRITICAL)."
          echo "ЗАЧЕМ: например, процесс от root в контейнере: при взломе приложения"
          echo "       атакующий получает полные права внутри контейнера."
          if ! docker run --rm -v "$PWD:/repo" -w /repo \
            aquasec/trivy:0.75.0 config --exit-code 1 --severity HIGH,CRITICAL /repo; then
            echo "::error title=trivy::Опасные настройки в Dockerfile, подробности в логе шага"
            echo "КАК ИСПРАВИТЬ: у замечания есть ID (например DS-0002) и ссылка с примером."
            echo "  Root: создай пользователя (RUN useradd) и переключись на него (USER app)."
            exit 1
          fi

  # Не стоит делать обязательной проверкой (required check): свежая уязвимость
  # в библиотеке иначе заблокирует все ПР, даже не связанные с зависимостями.
  deps-audit:
    name: Vulnerable dependencies (pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Python (pip-audit)
        if: ${{ !cancelled() }}
        run: |
          echo "ЧТО: pip-audit - известные уязвимости (CVE) в Python-зависимостях"
          echo "     бэкенда и скрипта s3 (requirements.txt)."
          echo "ЗАЧЕМ: уязвимая библиотека - дыра в приложении, даже если наш код идеален."
          if ! pip-audit -r backend/requirements.txt -r s3/requirements.txt \
            --desc on --progress-spinner off; then
            echo "::error title=pip-audit::Уязвимые Python-зависимости, подробности в логе шага"
            echo "КАК ИСПРАВИТЬ: в таблице есть пакет и Fix Versions - подними версию"
            echo "  в requirements.txt до исправленной и проверь, что тесты проходят."
            echo "  Если исправленной версии ещё нет - сообщи ментору."
            exit 1
          fi

      - name: Фронтенд (npm audit)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          echo "ЧТО: npm audit - уязвимости HIGH и CRITICAL в зависимостях фронтенда,"
          echo "     которые попадают в браузер пользователя (без devDependencies)."
          echo "ЗАЧЕМ: уязвимая библиотека в бандле работает у каждого пользователя."
          if ! npm audit --omit=dev --audit-level=high; then
            echo "::error title=npm audit::Уязвимые зависимости фронтенда, подробности в логе шага"
            echo "КАК ИСПРАВИТЬ: cd frontend && npm audit fix, затем npm run build и проверь"
            echo "  приложение. Если нужен --force (мажорное обновление) - согласуй с ментором."
            exit 1
          fi
