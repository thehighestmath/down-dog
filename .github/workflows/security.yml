name: Security

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets in git history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, not just the last commit:
          # a secret that was committed and then deleted is still leaked
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose /repo

  trivy-config:
    name: Dockerfile misconfigurations (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker image instead of aquasecurity/trivy-action: the action's tags
      # were hijacked in a supply chain attack, a pinned image is safer.
      - name: Scan
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          aquasec/trivy:0.75.0
          config --exit-code 1 --severity HIGH,CRITICAL /repo
