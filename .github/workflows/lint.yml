name: Lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  pre-commit:
    name: pre-commit (ruff, eslint, prettier, hadolint, ...)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # eslint hook runs from the root node_modules
      - name: Install Node dependencies
        run: npm ci

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      # Same hooks as locally, so "works on my machine" == "works in CI".
      # no-commit-to-branch is for local use only: in CI we are always on a commit.
      - name: Run hooks
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure --color=always
