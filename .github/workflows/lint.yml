name: Lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  python:
    name: Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  frontend:
    name: JS/TS/HTML (ESLint + Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Prettier check
        run: |
          files=$(find . -type f \( -name '*.js' -o -name '*.ts' -o -name '*.tsx' -o -name '*.html' -o -name '*.css' -o -name '*.scss' \) \
            -not -path './node_modules/*' -not -path './.git/*')
          if [ -n "$files" ]; then
            npx prettier --check $files
          else
            echo "No JS/TS/HTML/CSS files to check"
          fi