name: Frontend

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # "build" = tsc -b && vite build, so TypeScript errors fail the job
      - name: Build
        run: npm run build
