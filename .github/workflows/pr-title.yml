name: PR title

# On squash merge the PR title becomes the commit message on master,
# so it has to follow Conventional Commits just like local commits.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          python scripts/check_commit_msg.py "$RUNNER_TEMP/title.txt"
