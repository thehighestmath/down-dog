name: PR title

# On squash merge the PR title becomes the commit message on master,
# so it has to follow Conventional Commits just like local commits.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "ЧТО: заголовок PR в формате Conventional Commits: тип(область): описание."
          echo "ЗАЧЕМ: при squash merge заголовок PR становится сообщением коммита в master,"
          echo "       по нему читают историю и собирают changelog."
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          if ! python scripts/check_commit_msg.py "$RUNNER_TEMP/title.txt"; then
            echo "::error title=PR title::Заголовок PR не в формате Conventional Commits"
            echo "КАК ИСПРАВИТЬ: нажми Edit рядом с заголовком PR и переименуй, например:"
            echo "  feat: генерация тренировки по уровню"
            echo "  fix(backend): 500 при пустом списке поз"
            echo "  Типы: feat, fix, docs, style, refactor, test, build, ci, chore, perf."
            echo "  Проверка перезапустится сама."
            exit 1
          fi
