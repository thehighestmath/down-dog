name: Project automation

# Автоматизация GitHub Project (свои правила в самом проекте задать нельзя).
#
# fill: заполняет поля "В <статус> с" датой, когда задача
# оказалась в этом статусе. Смену статуса в пользовательском проекте нельзя
# поймать триггером Actions, поэтому workflow запускается по расписанию:
# находит задачи, у которых пустое поле для текущего статуса, и ставит туда
# сегодняшнюю дату. Уже заполненные даты не трогает.
#
# assignees: вешает метку multiple-assignees на issue, у которых больше одного
# исполнителя, и снимает её, когда исполнитель остался один.
#
# deadline: вешает метку overdue на открытые issue, у которых поле "Дедлайн"
# уже прошло, и снимает её, когда дедлайн перенесли вперёд, убрали или задачу
# закрыли.
#
# linked-issue: вешает метку no-linked-issue на открытые ПР без залинкованной
# задачи (closingIssuesReferences) и снимает её, когда связь появилась. Дублирует
# pr-linked-issue.yml по расписанию: возвращает метку, если её сняли руками, и
# ловит привязку через панель Linked issues - на неё нет события для Actions.
#
# review-rollback: возвращает задачи из In Review в In Progress, если к ним не
# залинкован ни один открытый или смерженный ПР (closedByPullRequestsReferences),
# очищает дату "В In Review с" и пишет в issue комментарий исполнителям.
# Идёт до fill, чтобы fill в том же запуске не поставил дату обратно.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: project-automation
  cancel-in-progress: false

jobs:
  review-rollback:
    name: Roll back In Review issues without a linked PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Нужен classic PAT со scope project и repo
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: thehighestmath
      PROJECT_NUMBER: 5
      FROM_STATUS: In Review
      TO_STATUS: In Progress
    steps:
      - name: Roll back
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=PROJECT_TOKEN::Не задан секрет PROJECT_TOKEN (classic PAT со scope project и repo)"
            exit 1
          fi

          # $-переменные в одинарных кавычках ниже - переменные GraphQL и jq, не shell
          # shellcheck disable=SC2016
          project=$(gh api graphql \
            -f login="$OWNER" -F number="$PROJECT_NUMBER" \
            -f query='
              query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {
                    id
                    status: field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                    fields(first: 50) {
                      nodes { ... on ProjectV2Field { id name dataType } }
                    }
                  }
                }
              }')
          project_id=$(jq -r '.data.user.projectV2.id' <<<"$project")
          status_field=$(jq -r '.data.user.projectV2.status.id' <<<"$project")
          to_option=$(jq -r '.data.user.projectV2.status.options[]
            | select(.name == env.TO_STATUS) | .id' <<<"$project")
          if [ -z "$to_option" ]; then
            echo "::error::В поле Status нет варианта \"$TO_STATUS\""
            exit 1
          fi
          # Дату "В In Review с" очищаем, чтобы при настоящем переходе в ревью fill поставил новую
          review_date_field=$(jq -r '.data.user.projectV2.fields.nodes[]
            | select(.dataType == "DATE" and .name == ("В " + env.FROM_STATUS + " с")) | .id' <<<"$project")

          # Строки "<item id>\t<repo>\t<номер>\t<@исполнители>" для issue в In Review
          # без открытого или смерженного ПР
          # shellcheck disable=SC2016
          rollback=$(gh api graphql --paginate \
            -f login="$OWNER" -F number="$PROJECT_NUMBER" \
            -f query='
              query($login: String!, $number: Int!, $endCursor: String) {
                user(login: $login) {
                  projectV2(number: $number) {
                    items(first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        status: fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        content {
                          ... on Issue {
                            number
                            repository { nameWithOwner }
                            assignees(first: 10) { nodes { login } }
                            closedByPullRequestsReferences(first: 20, includeClosedPrs: true) {
                              nodes { state }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.user.projectV2.items.nodes[]
              | select(.status.name == env.FROM_STATUS and .content.number != null)
              | select([.content.closedByPullRequestsReferences.nodes[].state
                  | select(. == "OPEN" or . == "MERGED")] | length == 0)
              | [.id, .content.repository.nameWithOwner, .content.number,
                 ([.content.assignees.nodes[].login | "@" + .] | join(" "))]
              | @tsv')

          rolled=0
          while IFS=$'\t' read -r item repo number mentions; do
            [ -n "$item" ] || continue
            gh project item-edit --project-id "$project_id" --id "$item" \
              --field-id "$status_field" --single-select-option-id "$to_option" >/dev/null
            if [ -n "$review_date_field" ]; then
              gh project item-edit --project-id "$project_id" --id "$item" \
                --field-id "$review_date_field" --clear >/dev/null
            fi
            body="${mentions:+$mentions }Задача возвращена в **$TO_STATUS**: к ней не залинкован ПР."
            body+=$'\n'"Добавь \`Closes #$number\` в описание ПР или привяжи его через панель Linked issues,"
            body+=" и потом переводи задачу в $FROM_STATUS."
            gh issue comment "$number" -R "$repo" --body "$body" >/dev/null
            echo "$repo#$number: $FROM_STATUS -> $TO_STATUS" | tee -a "$GITHUB_STEP_SUMMARY"
            rolled=$((rolled + 1))
          done <<<"$rollback"

          echo "Возвращено задач: $rolled" | tee -a "$GITHUB_STEP_SUMMARY"

  fill:
    name: Fill "В <статус> с" fields
    # После отката, иначе fill может поставить дату "В In Review с" обратно
    needs: review-rollback
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # GITHUB_TOKEN не видит пользовательские проекты: нужен classic PAT со scope project
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: thehighestmath
      PROJECT_NUMBER: 5
      TZ: Europe/Moscow
    steps:
      - name: Fill dates
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=PROJECT_TOKEN::Не задан секрет PROJECT_TOKEN (classic PAT со scope project)"
            exit 1
          fi
          today=$(date +%F)

          # $-переменные в одинарных кавычках ниже - переменные GraphQL и jq, не shell
          # shellcheck disable=SC2016
          project=$(gh api graphql \
            -f login="$OWNER" -F number="$PROJECT_NUMBER" \
            -f query='
              query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes { ... on ProjectV2Field { id name dataType } }
                    }
                  }
                }
              }')
          project_id=$(jq -r '.data.user.projectV2.id' <<<"$project")
          # {"В Todo с": "PVTF_...", ...}
          date_fields=$(jq -c '[.data.user.projectV2.fields.nodes[]
            | select(.dataType == "DATE") | {(.name): .id}] | add // {}' <<<"$project")

          # Строки "<item id>\t<статус>" для задач, у которых не заполнено "В <статус> с"
          # shellcheck disable=SC2016
          todo=$(gh api graphql --paginate \
            -f login="$OWNER" -F number="$PROJECT_NUMBER" \
            -f query='
              query($login: String!, $number: Int!, $endCursor: String) {
                user(login: $login) {
                  projectV2(number: $number) {
                    items(first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        status: fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                        fieldValues(first: 50) {
                          nodes {
                            ... on ProjectV2ItemFieldDateValue {
                              field { ... on ProjectV2Field { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.user.projectV2.items.nodes[]
              | select(.status.name != null)
              | ("В " + .status.name + " с") as $field
              | select([.fieldValues.nodes[].field.name] | index($field) | not)
              | [.id, .status.name] | @tsv')

          updated=0
          while IFS=$'\t' read -r item status; do
            [ -n "$item" ] || continue
            field_id=$(jq -r --arg f "В $status с" '.[$f] // empty' <<<"$date_fields")
            if [ -z "$field_id" ]; then
              echo "::warning::В проекте нет date-поля \"В $status с\", статус пропущен"
              continue
            fi
            gh project item-edit --project-id "$project_id" --id "$item" \
              --field-id "$field_id" --date "$today" >/dev/null
            echo "$item: В $status с = $today"
            updated=$((updated + 1))
          done <<<"$todo"

          echo "Обновлено задач: $updated" | tee -a "$GITHUB_STEP_SUMMARY"

  assignees:
    name: Label issues with several assignees
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Для меток PAT нужен ещё и scope repo
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: thehighestmath
      PROJECT_NUMBER: 5
      LABEL: multiple-assignees
    steps:
      - name: Sync label
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=PROJECT_TOKEN::Не задан секрет PROJECT_TOKEN (classic PAT со scope project и repo)"
            exit 1
          fi

          # Строки "<repo>\t<номер>\t<add|remove>" для issue, где метку надо поставить или снять.
          # $-переменные в одинарных кавычках - переменные GraphQL и jq, не shell
          # shellcheck disable=SC2016
          changes=$(gh api graphql --paginate \
            -f login="$OWNER" -F number="$PROJECT_NUMBER" \
            -f query='
              query($login: String!, $number: Int!, $endCursor: String) {
                user(login: $login) {
                  projectV2(number: $number) {
                    items(first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        content {
                          ... on Issue {
                            number
                            repository { nameWithOwner }
                            assignees { totalCount }
                            labels(first: 100) { nodes { name } }
                          }
                        }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.user.projectV2.items.nodes[].content
              | select(.number != null)
              | (.assignees.totalCount > 1) as $many
              | ([.labels.nodes[].name] | index(env.LABEL) != null) as $labeled
              | if $many and ($labeled | not) then [.repository.nameWithOwner, .number, "add"]
                elif ($many | not) and $labeled then [.repository.nameWithOwner, .number, "remove"]
                else empty end
              | @tsv')

          while IFS=$'\t' read -r repo number action; do
            [ -n "$repo" ] || continue
            if [ "$action" = add ]; then
              if ! gh label list -R "$repo" --limit 500 --json name --jq '.[].name' | grep -Fxq "$LABEL"; then
                gh label create "$LABEL" -R "$repo" --color d93f0b \
                  --description "У задачи должен быть один исполнитель"
              fi
              gh issue edit "$number" -R "$repo" --add-label "$LABEL" >/dev/null
            else
              gh issue edit "$number" -R "$repo" --remove-label "$LABEL" >/dev/null
            fi
            echo "$repo#$number: $action $LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<<"$changes"

  deadline:
    name: Label overdue issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Для меток PAT нужен ещё и scope repo
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: thehighestmath
      PROJECT_NUMBER: 5
      LABEL: overdue
      TZ: Europe/Moscow
    steps:
      - name: Sync overdue label
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=PROJECT_TOKEN::Не задан секрет PROJECT_TOKEN (classic PAT со scope project и repo)"
            exit 1
          fi
          today=$(date +%F)
          export TODAY="$today"

          # Строки "<repo>\t<номер>\t<add|remove>" для задач с полем "Дедлайн".
          # Метку overdue вешаем, когда дедлайн уже прошёл (deadline < today)
          # и задача ещё открыта; снимаем во всех остальных случаях - когда дедлайн
          # перенесли вперёд, убрали, или задачу закрыли.
          # $-переменные в одинарных кавычках - переменные GraphQL и jq, не shell
          # shellcheck disable=SC2016
          changes=$(gh api graphql --paginate \
            -f login="$OWNER" -F number="$PROJECT_NUMBER" \
            -f query='
              query($login: String!, $number: Int!, $endCursor: String) {
                user(login: $login) {
                  projectV2(number: $number) {
                    items(first: 100, after: $endCursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        content {
                          ... on Issue {
                            number
                            repository { nameWithOwner }
                            state
                            labels(first: 100) { nodes { name } }
                          }
                        }
                        deadline: fieldValueByName(name: "Дедлайн") {
                          ... on ProjectV2ItemFieldDateValue { date }
                        }
                      }
                    }
                  }
                }
              }' \
            --jq '.data.user.projectV2.items.nodes[]
              | select(.content.number != null)
              | .content as $c
              | (.deadline.date // null) as $deadline
              | ($c.state == "OPEN" and $deadline != null and $deadline < env.TODAY) as $overdue
              | ([$c.labels.nodes[].name] | index(env.LABEL) != null) as $labeled
              | if $overdue and ($labeled | not) then [$c.repository.nameWithOwner, $c.number, "add"]
                elif $labeled and ($overdue | not) then [$c.repository.nameWithOwner, $c.number, "remove"]
                else empty end
              | @tsv')

          while IFS=$'\t' read -r repo number action; do
            [ -n "$repo" ] || continue
            if [ "$action" = add ]; then
              if ! gh label list -R "$repo" --limit 500 --json name --jq '.[].name' | grep -Fxq "$LABEL"; then
                gh label create "$LABEL" -R "$repo" --color d93f0b \
                  --description "Deadline in the project has passed"
              fi
              gh issue edit "$number" -R "$repo" --add-label "$LABEL" >/dev/null
            else
              gh issue edit "$number" -R "$repo" --remove-label "$LABEL" >/dev/null
            fi
            echo "$repo#$number: $action $LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<<"$changes"

  linked-issue:
    name: Label PRs without a linked issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Для меток PAT нужен scope repo
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: thehighestmath
      REPO: down-dog
      LABEL: no-linked-issue
    steps:
      - name: Sync no-linked-issue label
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=PROJECT_TOKEN::Не задан секрет PROJECT_TOKEN (classic PAT со scope project и repo)"
            exit 1
          fi

          # Строки "<номер>\t<add|remove>" для открытых ПР, где метку надо поставить или снять.
          # $-переменные в одинарных кавычках - переменные GraphQL и jq, не shell
          # shellcheck disable=SC2016
          changes=$(gh api graphql --paginate \
            -f owner="$OWNER" -f repo="$REPO" \
            -f query='
              query($owner: String!, $repo: String!, $endCursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequests(states: OPEN, first: 100, after: $endCursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      number
                      closingIssuesReferences { totalCount }
                      labels(first: 100) { nodes { name } }
                    }
                  }
                }
              }' \
            --jq '.data.repository.pullRequests.nodes[]
              | (.closingIssuesReferences.totalCount == 0) as $unlinked
              | ([.labels.nodes[].name] | index(env.LABEL) != null) as $labeled
              | if $unlinked and ($labeled | not) then [.number, "add"]
                elif ($unlinked | not) and $labeled then [.number, "remove"]
                else empty end
              | @tsv')

          while IFS=$'\t' read -r number action; do
            [ -n "$number" ] || continue
            if [ "$action" = add ]; then
              if ! gh label list -R "$OWNER/$REPO" --limit 500 --json name --jq '.[].name' | grep -Fxq "$LABEL"; then
                gh label create "$LABEL" -R "$OWNER/$REPO" --color d93f0b \
                  --description "PR has no linked issue/task"
              fi
              gh pr edit "$number" -R "$OWNER/$REPO" --add-label "$LABEL" >/dev/null
            else
              gh pr edit "$number" -R "$OWNER/$REPO" --remove-label "$LABEL" >/dev/null
            fi
            echo "PR #$number: $action $LABEL" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<<"$changes"
