server {
  listen 8080;
  root /usr/share/nginx/html;

  # Сжатие. Включено здесь, только если прокси из #60 сам не сжимает
  # (проверка: curl -sI -H "Accept-Encoding: gzip" https://<домен>/assets/<файл>.js).
  # Если прокси сжимает, удалите весь этот блок, чтобы сжатие было в одном месте.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;  # сжимать и ответы бэкенда (/api/poses), и запросы через прокси
  gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;
  # text/html сжимается по умолчанию. Аудио (audio/*) в список не входит: оно уже сжато

  # Файлы с хешем в имени: содержимое не меняется, кэш на год
  location /assets/ {
    try_files $uri =404;  # пропавший файл даёт 404, а не index.html с immutable
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html и всё остальное: браузер каждый раз перепроверяет (ETag -> 304)
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /api/analytics/track {
    client_max_body_size 4k;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    # Без слеша в конце: путь передаётся как есть (/api/poses -> /api/poses).
    # Со слешем nginx отрезал бы /api/, а роуты бэкенда начинаются с /api/
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
